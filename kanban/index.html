<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:var(--text)}#board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow-x:auto;padding:4px 2px 16px}.column{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;min-height:350px}.heading{font-size:12px;font-weight:700;padding:4px 3px 16px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px;cursor:pointer;box-shadow:0 3px 10px #00000008}.card:hover{border-color:var(--accent);transform:translateY(-1px)}.id{font:10px monospace;color:var(--muted)}.title{font-weight:600;line-height:1.5;margin:9px 0 14px}.meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:5px}.drop{outline:2px dashed var(--accent)}button{color:var(--text);background:var(--card);border:1px solid var(--line);padding:7px;border-radius:6px;cursor:pointer}button:focus,.card:focus{outline:2px solid var(--accent)}
</style></head><body><div id="board"></div><script>
let eventSequence=0;
// Event deduplication only: no secure-context API or authentication role.
const eventId=()=>Date.now().toString(36)+'-'+(++eventSequence)+'-'+Math.random().toString(36).slice(2);
const emit=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');let args;
function action(value){emit('streamlit:setComponentValue',{value:{...value,nonce:eventId()},dataType:'json'});}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;for(const [k,v]of Object.entries(args.colors))document.documentElement.style.setProperty('--'+k,v);const root=document.querySelector('#board');root.replaceChildren();
for(const status of args.statuses){const col=document.createElement('section');col.className='column';col.setAttribute('aria-label',status);const group=args.tasks.filter(t=>t.status===status);const head=document.createElement('div');head.className='heading';head.textContent=status+'  ·  '+group.length;col.append(head);if(args.writable){col.ondragover=e=>{e.preventDefault();col.classList.add('drop')};col.ondragleave=()=>col.classList.remove('drop');col.ondrop=e=>{e.preventDefault();col.classList.remove('drop');action({action:'move',id:e.dataTransfer.getData('text/plain'),status});};}
for(const t of group){const card=document.createElement('div');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',t.title);card.draggable=args.writable;card.ondragstart=e=>e.dataTransfer.setData('text/plain',t.id);card.onclick=()=>action({action:'open',id:t.id});card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action({action:'open',id:t.id})}};for(const [cls,text] of [['id',t.id],['title',t.title],['meta',t.priority+' priority · '+(t.owner||'Unassigned')],['meta',t.due?'Due '+t.due:'']]){const el=document.createElement('div');el.className=cls;el.textContent=text;card.append(el);}col.append(card);}root.append(col);}
emit('streamlit:setFrameHeight',{height:Math.min(1000,document.body.scrollHeight+10)});});emit('streamlit:componentReady',{apiVersion:1});
</script></body></html>
