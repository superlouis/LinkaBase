services:
  workspace:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8501:8501"
    environment:
      WORKSPACE_DIR: /data
      EDITOR_PUBLIC_URL: ${EDITOR_PUBLIC_URL:-http://localhost:8090}
    volumes:
      - ${LINKABASE_DATA_DIR:-./workspace}:/data
  drawing-studio:
    build: .
    restart: unless-stopped
    command: uvicorn editor_api:app --host 0.0.0.0 --port 8090
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8090:8090"
    environment:
      WORKSPACE_DIR: /data
    volumes:
      - ${LINKABASE_DATA_DIR:-./workspace}:/data
