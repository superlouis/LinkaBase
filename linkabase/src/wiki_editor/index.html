<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#fff;--card:#fff;--text:#17243a;--muted:#536580;--line:#cbd5e3;--accent:#245bd6;--onaccent:#fff}*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:var(--text);background:var(--bg)}button,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent)}header{display:flex;align-items:center;gap:8px;margin-bottom:12px}#status{margin-right:auto;color:var(--muted);font-size:13px}#save{background:var(--accent);color:var(--onaccent);font-weight:650}#toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:10px 10px 0 0;background:var(--card)}#paper,#source{height:470px;width:100%;overflow:auto;border:1px solid var(--line);border-top:0;background:var(--card);color:var(--text);padding:24px 32px;border-radius:0 0 10px 10px;line-height:1.75;outline:none}#source{font:14px/1.7 monospace;border-top:1px solid var(--line);resize:vertical}#paper:empty:before{content:'Start writing…';color:var(--muted)}#paper img{max-width:100%}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:8px}a{color:var(--accent)}footer{font-size:12px;color:var(--muted);margin-top:8px}[hidden]{display:none!important}
#help{font-size:13px;color:var(--muted);margin:8px 0}#preview{height:470px;overflow:auto;padding:24px 32px;line-height:1.75;border:1px solid var(--line);border-radius:10px;background:var(--card)}#preview img{max-width:100%}header{position:sticky;top:0;background:var(--bg);z-index:5;padding:4px 0}#previewToggle[aria-pressed="true"]{border-color:var(--accent)}
</style></head><body><header><span id="status">Loading editor…</span><select id="mode" aria-label="Editor mode"><option value="visual">Visual editor</option><option value="source">Markdown source</option></select><button id="previewToggle" aria-pressed="false">Preview</button><button id="cancel">Cancel</button><button id="save">Save changes</button></header>
<div id="toolbar" role="toolbar" aria-label="Formatting"><select id="heading" aria-label="Paragraph style"><option value="p">Paragraph</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option></select><button data-cmd="bold" aria-label="Bold"><b>B</b></button><button data-cmd="italic" aria-label="Italic"><i>I</i></button><button data-cmd="insertUnorderedList">Bullet list</button><button data-cmd="insertOrderedList">Numbered list</button><button data-cmd="formatBlock" data-value="blockquote">Quote</button><button id="link">Link</button><button id="image">Image</button><button id="table">Table</button><button data-cmd="undo">Undo</button><button data-cmd="redo">Redo</button></div>
<p id="help">Visual editor · Select text to format it. Use the toolbar for headings, lists, links, images, and tables.</p><div id="paper" contenteditable="true" role="textbox" aria-label="Document body" aria-multiline="true"></div><textarea id="source" aria-label="Markdown source" hidden></textarea><div id="preview" aria-label="Document preview" hidden></div><footer>Ctrl/Cmd + S to save · Advanced documents can use Markdown source. Visual editing normalizes Markdown formatting.</footer><script src="bundle.js"></script></body></html>
