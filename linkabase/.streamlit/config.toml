[theme]
base = "dark"
primaryColor = "#9bcaff"
backgroundColor = "#10141d"
secondaryBackgroundColor = "#161c28"
textColor = "#edf3ff"
font = "sans serif"
[server]
maxUploadSize = 64
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
[browser]
gatherUsageStats = false
[client]
toolbarMode = "minimal"
showErrorDetails = false
